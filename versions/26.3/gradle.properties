# Settings for the Minecraft 26.3 build. The settings shared by all versions are in gradle.properties in the
# project root.

# Minecraft versions the jar accepts, written to fabric.mod.json. This jar covers 26.3.
minecraft_dependency=~26.3

# Fabric API version for the development client and the client game tests. Players need any Fabric API for this
# Minecraft version, the mod does not ask for a specific one.
fabric_api_version=0.164.0+26.3

# Controlling and Searchables (which Controlling needs), only for the client game tests with -PwithControlling:
# Controlling 26.3.4, Searchables 1.0.3. Modrinth version IDs, because both mods use the same version number for their
# Fabric and NeoForge files, and Searchables for several Minecraft versions.
controlling_version=V6AbRm67
searchables_version=wV79bLRS
