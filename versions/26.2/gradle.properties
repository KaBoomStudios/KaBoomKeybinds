# Settings for the Minecraft 26.2 build. The settings shared by all versions are in gradle.properties in the
# project root.

# Minecraft versions the jar accepts, written to fabric.mod.json. This jar covers 26.2.
minecraft_dependency=~26.2

# Fabric API is used for the development client and the client game tests only. The mod itself does not require it.
fabric_api_version=0.161.0+26.2

# Controlling and Searchables (which Controlling needs), only for the client game tests with -PwithControlling:
# Controlling 26.2.4, Searchables 1.0.1. Modrinth version IDs, because both mods use the same version number for their
# Fabric and NeoForge files, and Searchables for several Minecraft versions.
controlling_version=sZHXONgm
searchables_version=bvFby61J
