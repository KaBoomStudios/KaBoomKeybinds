# Settings for the Minecraft 26.1.2 build. The settings shared by all versions are in gradle.properties in the
# project root.

# Minecraft versions the jar accepts, written to fabric.mod.json. The jar is built against 26.1.2 and also covers
# 26.1 and 26.1.1, which do not differ from it in the classes this mod uses.
minecraft_dependency=~26.1

# Fabric API is used for the development client and the client game tests only. The mod itself does not require it.
fabric_api_version=0.155.3+26.1.2
